name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name my_home_food_os .

      - name: Configure microphone permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace('<application', permission + '    <application', 1)
          # Android 11+ package visibility for speech recognition and text-to-speech.
          intents = (
              '        <intent>\n            <action android:name="android.speech.RecognitionService"/>\n        </intent>\n'
              '        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE"/>\n        </intent>\n'
          )
          if "android.speech.RecognitionService" not in s:
              if "<queries>" in s:
                  s = s.replace("<queries>\n", "<queries>\n" + intents, 1)
              else:
                  s = s.replace('<application', '    <queries>\n' + intents + '    </queries>\n    <application', 1)
          p.write_text(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-home-food-os-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
